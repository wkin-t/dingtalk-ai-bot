# 1Panel 管理的 DingTalk AI 机器人服务 (OpenRouter 后端)
# 代码位置: /opt/1panel/docker/compose/dingtalk-ai-bot/
# 依赖: v2raya (由 1Panel 单独管理，提供 socks5://127.0.0.1:1080 代理)

services:
  dingtalk-ai-bot-openrouter:
    build:
      context: .
      dockerfile: Dockerfile
    image: dingtalk-ai-bot:openrouter
    container_name: dingtalk-ai-bot-openrouter
    restart: always
    network_mode: "host"
    environment:
      # 通过 Gemini 原生协议调用 sub2api Antigravity 专用端点；
      # Claude 模型由 Antigravity 在 /antigravity/v1beta 下统一适配。
      - AI_BACKEND=gemini
      - BOT_ID=openrouter
      - FLASK_PORT=35002
    env_file:
      - .env.openrouter
    volumes:
      - ./data-openrouter:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
